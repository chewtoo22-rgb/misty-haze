<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0f">
<title>Misty Haze</title>
<style>
:root{--bg:#090a0f;--panel:#11131a;--panel2:#171a23;--line:#262b38;--text:#f4f7fb;--muted:#8d96a8;--accent:#9b7cff;--accent2:#65d7ff;--danger:#ff5f6d}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,textarea{font:inherit}body{display:flex;justify-content:center}.app{width:100%;max-width:1050px;height:100dvh;display:flex;flex-direction:column}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(9,10,15,.9);backdrop-filter:blur(16px)}.brand{display:flex;gap:10px;align-items:center;font-weight:750;letter-spacing:.2px}.orb{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#bda9ff 25%,#684cff 60%,#19112f);box-shadow:0 0 25px #795cff88}.status{font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:#52e39a;box-shadow:0 0 9px #52e39a}.messages{flex:1;overflow:auto;padding:30px 18px 120px}.welcome{max-width:760px;margin:12vh auto 0;text-align:center}.welcome h1{font-size:clamp(34px,7vw,62px);margin:0 0 12px;background:linear-gradient(100deg,#fff,#a99cff,#70ddff);-webkit-background-clip:text;color:transparent}.welcome p{color:var(--muted);font-size:16px}.message{max-width:820px;margin:0 auto 18px;display:flex;gap:12px}.message.user{justify-content:flex-end}.bubble{padding:13px 16px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}.assistant .bubble{background:var(--panel);border:1px solid var(--line)}.user .bubble{background:var(--accent);color:white;max-width:78%}.avatar{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-size:14px}.composer-wrap{position:fixed;bottom:0;left:0;right:0;padding:12px 14px 18px;background:linear-gradient(transparent,var(--bg) 25%)}.composer{max-width:820px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:8px;box-shadow:0 12px 40px #0008}.modes{display:flex;gap:6px;padding:2px 4px 8px}.mode{border:0;background:transparent;color:var(--muted);padding:7px 10px;border-radius:12px;cursor:pointer;font-size:13px}.mode.active{background:var(--panel2);color:var(--text)}.mode[data-mode=agent].active{color:var(--accent2)}.mode[data-mode=code].active{color:var(--accent)}.input-row{display:flex;gap:8px;align-items:flex-end}.input{flex:1;min-height:46px;max-height:160px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:12px}.send{width:44px;height:44px;border:0;border-radius:15px;background:var(--text);color:#090a0f;font-weight:800;cursor:pointer}.send:disabled{opacity:.35}.tools{display:flex;gap:8px;margin-top:9px}.chip{font-size:12px;color:var(--muted);border:1px solid var(--line);background:transparent;border-radius:10px;padding:5px 9px}.activity{max-width:820px;margin:0 auto 14px;border:1px solid var(--line);background:#0e1016;border-radius:14px;padding:12px;color:var(--muted);font-size:13px}.activity b{color:var(--text)}
</style>
</head>
<body><main class="app">
<header class="top"><div class="brand"><span class="orb"></span><span>Misty Haze</span></div><div class="status"><span class="dot"></span>Ready</div></header>
<section id="messages" class="messages"><div class="welcome" id="welcome"><h1>Misty Haze</h1><p>Chat. Code. See and use your devices.</p></div></section>
<div class="composer-wrap"><div class="composer"><div class="modes"><button class="mode active" data-mode="chat">💬 Chat</button><button class="mode" data-mode="code">💻 Code</button><button class="mode" data-mode="agent">👁 Agent</button></div><div class="input-row"><textarea id="input" class="input" rows="1" placeholder="What do you want me to do?"></textarea><button id="send" class="send">➤</button></div><div class="tools"><span class="chip" id="capability">Cloud AI</span><span class="chip">Memory ready</span><span class="chip">Tools ready</span></div></div></div>
</main><script src="chat.js"></script></body></html>
