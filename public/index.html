<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<title>Misty Haze</title>
<style>
:root{--bg:#08090d;--panel:#0f1118;--panel2:#151823;--line:#242938;--text:#f4f6fb;--muted:#8b94a8;--purple:#9d7cff;--cyan:#67ddff;--green:#58e39b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:radial-gradient(circle at 50% -10%,#1a1430 0,#08090d 42%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,textarea{font:inherit}body{display:flex;overflow:hidden}.app{width:100%;height:100dvh;display:grid;grid-template-columns:250px 1fr;grid-template-rows:64px 1fr}.sidebar{grid-row:1/3;border-right:1px solid var(--line);background:rgba(10,11,16,.88);padding:16px 12px}.brand{display:flex;gap:11px;align-items:center;padding:8px 8px 20px;font-weight:800;letter-spacing:.2px}.orb{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#c5b5ff 24%,#704cff 59%,#171027);box-shadow:0 0 28px #795cff88}.new{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:13px;padding:11px;text-align:left;cursor:pointer}.side-title{margin:22px 8px 8px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px}.cap{display:flex;justify-content:space-between;gap:8px;padding:9px 8px;color:var(--muted);font-size:13px}.cap span:last-child{color:var(--text)}.top{grid-column:2;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line);background:rgba(8,9,13,.72);backdrop-filter:blur(18px)}.top-title{font-weight:700}.status{font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}.main{grid-column:2;min-width:0;position:relative}.messages{height:100%;overflow:auto;padding:34px 20px 150px}.welcome{max-width:800px;margin:13vh auto 0;text-align:center}.welcome h1{font-size:clamp(40px,7vw,68px);margin:0 0 10px;background:linear-gradient(100deg,#fff,#aa98ff,#70ddff);-webkit-background-clip:text;color:transparent}.welcome p{color:var(--muted);font-size:15px}.quick{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:24px}.quick button{border:1px solid var(--line);background:rgba(15,17,24,.8);color:var(--muted);border-radius:12px;padding:9px 12px;cursor:pointer}.message{max-width:850px;margin:0 auto 18px;display:flex;gap:12px}.message.user{justify-content:flex-end}.bubble{padding:13px 16px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.58}.assistant .bubble{background:var(--panel);border:1px solid var(--line)}.user .bubble{background:var(--purple);max-width:78%}.avatar{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center}.activity{max-width:850px;margin:0 auto 14px;border:1px solid var(--line);background:#0c0e14;border-radius:13px;padding:10px 12px;color:var(--muted);font-size:12px}.activity b{color:var(--text)}.composer-wrap{position:absolute;z-index:4;bottom:0;left:0;right:0;padding:12px 18px 18px;background:linear-gradient(transparent,var(--bg) 28%)}.composer{max-width:850px;margin:auto;background:rgba(15,17,24,.96);border:1px solid var(--line);border-radius:22px;padding:8px;box-shadow:0 14px 45px #0009}.modes{display:flex;gap:5px;padding:2px 4px 8px}.mode{border:0;background:transparent;color:var(--muted);padding:7px 10px;border-radius:11px;cursor:pointer;font-size:13px}.mode.active{background:var(--panel2);color:var(--text)}.mode[data-mode=agent].active{color:var(--cyan)}.mode[data-mode=code].active{color:var(--purple)}.input-row{display:flex;gap:8px;align-items:flex-end}.input{flex:1;min-height:46px;max-height:170px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:12px}.send{width:44px;height:44px;border:0;border-radius:15px;background:var(--text);color:#08090d;font-weight:900;cursor:pointer}.send:disabled{opacity:.35}.tools{display:flex;gap:7px;margin-top:8px;align-items:center}.chip{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:5px 8px}.mobile-menu{display:none}
@media(max-width:760px){.app{display:flex;flex-direction:column}.sidebar{display:none}.top{height:58px;flex:0 0 58px}.mobile-menu{display:inline-flex;border:0;background:transparent;color:var(--text);font-size:20px}.top-title{font-size:14px}.main{flex:1;min-height:0}.messages{padding:24px 12px 145px}.welcome{margin-top:12vh}.welcome h1{font-size:44px}.composer-wrap{padding:8px 9px 12px}.user .bubble{max-width:88%}}
</style>
</head>
<body><main class="app">
<aside class="sidebar"><div class="brand"><span class="orb"></span><span>Misty Haze</span></div><button class="new" id="newChat">＋ New session</button><div class="side-title">Core</div><div class="cap"><span>Chat</span><span>ONLINE</span></div><div class="cap"><span>Code</span><span>READY</span></div><div class="cap"><span>Agent</span><span>READY</span></div><div class="side-title">Planned</div><div class="cap"><span>Vision</span><span>OFF</span></div><div class="cap"><span>PC control</span><span>OFF</span></div><div class="cap"><span>Android control</span><span>OFF</span></div></aside>
<header class="top"><button class="mobile-menu" id="newChatMobile">☰</button><div class="top-title">Misty Haze</div><div class="status"><span class="dot"></span><span id="statusText">Online</span></div></header>
<section class="main"><section id="messages" class="messages"><div class="welcome" id="welcome"><h1>Misty Haze</h1><p>One assistant. Three modes. Built to grow into vision, coding, and device control.</p><div class="quick"><button data-prompt="Explain what you can do.">What can you do?</button><button data-prompt="Help me build something.">Build something</button><button data-prompt="Help me troubleshoot a problem.">Troubleshoot</button></div></div></section>
<div class="composer-wrap"><div class="composer"><div class="modes"><button class="mode active" data-mode="chat">💬 Chat</button><button class="mode" data-mode="code">💻 Code</button><button class="mode" data-mode="agent">👁 Agent</button></div><div class="input-row"><textarea id="input" class="input" rows="1" placeholder="What do you want me to do?"></textarea><button id="send" class="send" aria-label="Send">➤</button></div><div class="tools"><span class="chip" id="capability">Cloud AI</span><span class="chip">Session memory</span><span class="chip">Streaming</span></div></div></div></section>
</main><script src="chat.js"></script></body></html>
